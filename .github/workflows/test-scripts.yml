name: test-scripts

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read guard and read report
        run: node --test tests/
