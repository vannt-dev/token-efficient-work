name: test-scripts

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the older run; runs on a branch always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read guard and read report
        run: node --test "tests/*.test.mjs"
