name: test-install

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same pull request cancels the older run; runs on a branch always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install twice and verify (idempotency + expected files)
        run: |
          set -e
          TARGET="$RUNNER_TEMP/proj"
          mkdir -p "$TARGET"
          bash install-project.sh "$TARGET"
          bash install-project.sh "$TARGET"

          for f in ".claude/skills/token-efficient-work/SKILL.md" \
                   ".agents/skills/token-efficient-work/SKILL.md" \
                   "AGENTS.md" "CLAUDE.md" "GEMINI.md" \
                   ".github/copilot-instructions.md" \
                   ".cursor/rules/token-efficient-work.mdc" \
                   "CONVENTIONS.md" ".aider.conf.yml"; do
            test -f "$TARGET/$f" || { echo "MISSING: $f"; exit 1; }
          done

          for f in "AGENTS.md" "CLAUDE.md" "GEMINI.md" \
                   ".github/copilot-instructions.md" \
                   ".cursor/rules/token-efficient-work.mdc" "CONVENTIONS.md"; do
            count=$(grep -c "Token-efficient work (global rule" "$TARGET/$f")
            [ "$count" -eq 1 ] || { echo "DUPLICATED after re-run: $f (count=$count)"; exit 1; }
          done

          grep -q "CONVENTIONS.md" "$TARGET/.aider.conf.yml"
          echo "OK: bash installer smoke test passed"

      - name: Upgrade a v0.1.0 block and a stale block in place
        run: |
          set -e
          TARGET="$RUNNER_TEMP/upgrade"
          mkdir -p "$TARGET"
          # v0.1.0 wrote the snippet without the end marker, then a blank line, then the old content.
          { grep -vF '<!-- /token-efficient-work -->' hooks/global-rule.snippet.md; printf '\nuser line\n\nuser para\n'; } > "$TARGET/AGENTS.md"
          { cat hooks/global-rule.snippet.md; printf '\nkeep me\n'; } | sed 's/^3\. .*/3. STALE RULE/' > "$TARGET/CLAUDE.md"
          bash install-project.sh "$TARGET"

          for f in AGENTS.md CLAUDE.md; do
            [ "$(grep -c 'Token-efficient work (global rule' "$TARGET/$f")" -eq 1 ] || { echo "DUPLICATED: $f"; exit 1; }
            grep -qF '<!-- /token-efficient-work -->' "$TARGET/$f" || { echo "NOT UPGRADED: $f"; exit 1; }
          done
          ! grep -q STALE "$TARGET/CLAUDE.md" || { echo "STALE RULE KEPT"; exit 1; }
          grep -qx 'user para' "$TARGET/AGENTS.md" && grep -qx 'keep me' "$TARGET/CLAUDE.md" || { echo "USER CONTENT LOST"; exit 1; }

          cp -r "$TARGET" "$RUNNER_TEMP/before"
          bash install-project.sh "$TARGET"
          diff -r "$RUNNER_TEMP/before" "$TARGET" || { echo "RE-RUN CHANGED FILES"; exit 1; }
          echo "OK: bash upgrade test passed"

      - name: User install, then uninstall keeps only the user's own text
        run: |
          set -e
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.codex" "$HOME/.gemini"
          printf 'my rule\n\nmy para\n' > "$HOME/.codex/AGENTS.md"
          cp "$HOME/.codex/AGENTS.md" "$RUNNER_TEMP/agents.before"
          # A v0.1.0 block has no end marker; it ends at the blank line before the user's text.
          { grep -vF '<!-- /token-efficient-work -->' hooks/global-rule.snippet.md; printf '\nold text\n'; } > "$HOME/.gemini/GEMINI.md"
          bash uninstall.sh
          [ "$(cat "$HOME/.gemini/GEMINI.md")" = "old text" ] || { echo "LEGACY BLOCK NOT REMOVED"; exit 1; }

          bash install.sh
          bash install.sh
          bash uninstall.sh
          bash uninstall.sh
          cmp "$HOME/.codex/AGENTS.md" "$RUNNER_TEMP/agents.before" || { echo "USER TEXT CHANGED"; exit 1; }
          [ "$(cat "$HOME/.gemini/GEMINI.md")" = "old text" ] || { echo "USER TEXT CHANGED: GEMINI.md"; exit 1; }
          for p in .copilot/copilot-instructions.md .agents/skills/token-efficient-work .claude/skills/token-efficient-work; do
            [ ! -e "$HOME/$p" ] || { echo "LEFT BEHIND: $p"; exit 1; }
          done
          echo "OK: bash uninstall test passed"

      - name: --check reports missing, current and outdated, and writes nothing
        run: |
          set -e
          TARGET="$RUNNER_TEMP/check"
          mkdir -p "$TARGET"
          if bash install-project.sh --check "$TARGET"; then echo "EMPTY PROJECT PASSED"; exit 1; fi
          [ -z "$(ls -A "$TARGET")" ] || { echo "CHECK WROTE TO AN EMPTY PROJECT"; exit 1; }

          bash install-project.sh "$TARGET"
          cp -r "$TARGET" "$RUNNER_TEMP/check.before"
          bash install-project.sh "$TARGET" --check || { echo "FRESH INSTALL NOT CURRENT"; exit 1; }
          diff -r "$RUNNER_TEMP/check.before" "$TARGET" || { echo "CHECK CHANGED FILES"; exit 1; }

          sed -i 's/^3\. .*/3. STALE RULE/' "$TARGET/CLAUDE.md"
          echo "local edit" >> "$TARGET/.agents/skills/token-efficient-work/SKILL.md"
          cp -r "$TARGET" "$RUNNER_TEMP/check.stale"
          if bash install-project.sh --check "$TARGET" > "$RUNNER_TEMP/check.out"; then
            echo "STALE PROJECT PASSED"; exit 1
          fi
          grep -qx "outdated -> $TARGET/CLAUDE.md" "$RUNNER_TEMP/check.out" || { echo "STALE BLOCK NOT FLAGGED"; exit 1; }
          grep -qx "outdated -> $TARGET/.agents/skills/token-efficient-work/SKILL.md" "$RUNNER_TEMP/check.out" \
            || { echo "CHANGED SKILL NOT FLAGGED"; exit 1; }
          grep -qx "current -> $TARGET/AGENTS.md" "$RUNNER_TEMP/check.out" || { echo "CURRENT FILE NOT REPORTED"; exit 1; }
          diff -r "$RUNNER_TEMP/check.stale" "$TARGET" || { echo "CHECK CHANGED FILES"; exit 1; }

          export HOME="$RUNNER_TEMP/checkhome"
          mkdir -p "$HOME"
          if bash install.sh --check; then echo "EMPTY HOME PASSED"; exit 1; fi
          [ -z "$(ls -A "$HOME")" ] || { echo "CHECK WROTE TO AN EMPTY HOME"; exit 1; }
          bash install.sh
          bash install.sh --check || { echo "FRESH USER INSTALL NOT CURRENT"; exit 1; }
          sed -i 's/^3\. .*/3. STALE RULE/' "$HOME/.gemini/GEMINI.md"
          if bash install.sh --check > "$RUNNER_TEMP/check.out"; then echo "STALE HOME PASSED"; exit 1; fi
          grep -qx "outdated -> $HOME/.gemini/GEMINI.md" "$RUNNER_TEMP/check.out" || { echo "STALE BLOCK NOT FLAGGED"; exit 1; }
          if bash install.sh --chek; then echo "UNKNOWN OPTION ACCEPTED"; exit 1; fi
          echo "OK: bash --check test passed"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install twice and verify (idempotency + expected files)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Target = Join-Path $env:RUNNER_TEMP "proj"
          New-Item -ItemType Directory -Force -Path $Target | Out-Null
          .\install-project.ps1 -TargetDir $Target
          .\install-project.ps1 -TargetDir $Target

          $Files = @(
            ".claude\skills\token-efficient-work\SKILL.md",
            ".agents\skills\token-efficient-work\SKILL.md",
            "AGENTS.md", "CLAUDE.md", "GEMINI.md",
            ".github\copilot-instructions.md",
            ".cursor\rules\token-efficient-work.mdc",
            "CONVENTIONS.md", ".aider.conf.yml"
          )
          foreach ($f in $Files) {
            $p = Join-Path $Target $f
            if (-not (Test-Path $p)) { Write-Error "MISSING: $f"; exit 1 }
          }

          $HookFiles = @("AGENTS.md","CLAUDE.md","GEMINI.md",".github\copilot-instructions.md",".cursor\rules\token-efficient-work.mdc","CONVENTIONS.md")
          foreach ($f in $HookFiles) {
            $p = Join-Path $Target $f
            $count = (Select-String -Path $p -Pattern "Token-efficient work \(global rule" -AllMatches).Matches.Count
            if ($count -ne 1) { Write-Error "DUPLICATED after re-run: $f (count=$count)"; exit 1 }
          }

          Select-String -Path (Join-Path $Target ".aider.conf.yml") -Pattern "CONVENTIONS.md" -Quiet
          Write-Host "OK: powershell installer smoke test passed"

      - name: Upgrade a v0.1.0 block and a stale block in place
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Target = Join-Path $env:RUNNER_TEMP "upgrade"
          New-Item -ItemType Directory -Force -Path $Target | Out-Null
          $End = "<!-- /token-efficient-work -->"
          $Snippet = [IO.File]::ReadAllText((Resolve-Path "hooks\global-rule.snippet.md"))
          # v0.1.0 wrote the snippet without the end marker (with a BOM, CRLF), then a blank line, then the old content.
          $Legacy = ($Snippet.Replace("$End`n", "") -replace "`n", "`r`n") + "`r`nuser line`r`n`r`nuser para`r`n"
          [IO.File]::WriteAllText("$Target\AGENTS.md", $Legacy, (New-Object System.Text.UTF8Encoding $true))
          [IO.File]::WriteAllText("$Target\CLAUDE.md", (($Snippet -replace "(?m)^3\. .*$", "3. STALE RULE") + "`nkeep me`n"))
          .\install-project.ps1 -TargetDir $Target

          foreach ($f in "AGENTS.md", "CLAUDE.md") {
            $t = [IO.File]::ReadAllText("$Target\$f")
            if (([regex]::Matches($t, "Token-efficient work \(global rule")).Count -ne 1) { Write-Error "DUPLICATED: $f"; exit 1 }
            if (-not $t.Contains($End)) { Write-Error "NOT UPGRADED: $f"; exit 1 }
          }
          $a = [IO.File]::ReadAllText("$Target\AGENTS.md"); $c = [IO.File]::ReadAllText("$Target\CLAUDE.md")
          if ($c.Contains("STALE")) { Write-Error "STALE RULE KEPT"; exit 1 }
          if (-not $a.Contains("user para") -or -not $c.Contains("keep me")) { Write-Error "USER CONTENT LOST"; exit 1 }

          $Before = (Get-ChildItem -Recurse -File $Target | Get-FileHash).Hash -join ","
          .\install-project.ps1 -TargetDir $Target
          $After = (Get-ChildItem -Recurse -File $Target | Get-FileHash).Hash -join ","
          if ($Before -ne $After) { Write-Error "RE-RUN CHANGED FILES"; exit 1 }
          Write-Host "OK: powershell upgrade test passed"

      - name: User install, then uninstall keeps only the user's own text
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $UserHome = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force -Path "$UserHome\.codex", "$UserHome\.gemini" | Out-Null
          $Mine = "my rule`r`n`r`nmy para`r`n"
          [IO.File]::WriteAllText("$UserHome\.codex\AGENTS.md", $Mine)
          # A v0.1.0 block has no end marker; it ends at the blank line before the user's text.
          $Snippet = [IO.File]::ReadAllText((Resolve-Path "hooks\global-rule.snippet.md"))
          [IO.File]::WriteAllText("$UserHome\.gemini\GEMINI.md", $Snippet.Replace("<!-- /token-efficient-work -->`n", "") + "`nold text`n")
          .\uninstall.ps1 -UserHome $UserHome
          if ([IO.File]::ReadAllText("$UserHome\.gemini\GEMINI.md") -cne "old text`n") { Write-Error "LEGACY BLOCK NOT REMOVED"; exit 1 }

          .\install.ps1 -UserHome $UserHome
          .\install.ps1 -UserHome $UserHome
          .\uninstall.ps1 -UserHome $UserHome
          .\uninstall.ps1 -UserHome $UserHome
          if ([IO.File]::ReadAllText("$UserHome\.codex\AGENTS.md") -cne $Mine) { Write-Error "USER TEXT CHANGED"; exit 1 }
          if ([IO.File]::ReadAllText("$UserHome\.gemini\GEMINI.md") -cne "old text`n") { Write-Error "USER TEXT CHANGED: GEMINI.md"; exit 1 }
          foreach ($p in ".copilot\copilot-instructions.md", ".agents\skills\token-efficient-work", ".claude\skills\token-efficient-work") {
            if (Test-Path (Join-Path $UserHome $p)) { Write-Error "LEFT BEHIND: $p"; exit 1 }
          }
          Write-Host "OK: powershell uninstall test passed"

      - name: -Check reports missing, current and outdated, and writes nothing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Hash every file and list every directory, so a new empty directory counts as a change.
          function Get-Tree([string]$Dir) {
            (Get-ChildItem -Recurse -Force $Dir | ForEach-Object {
              if ($_.PSIsContainer) { $_.FullName } else { $_.FullName + "=" + (Get-FileHash $_.FullName).Hash }
            }) -join ","
          }
          $Target = Join-Path $env:RUNNER_TEMP "check"
          New-Item -ItemType Directory -Force -Path $Target | Out-Null
          .\install-project.ps1 -TargetDir $Target -Check
          if ($LASTEXITCODE -ne 1) { Write-Error "EMPTY PROJECT: exit $LASTEXITCODE, want 1"; exit 1 }
          if (Get-ChildItem -Force $Target) { Write-Error "CHECK WROTE TO AN EMPTY PROJECT"; exit 1 }

          .\install-project.ps1 -TargetDir $Target
          $Before = Get-Tree $Target
          .\install-project.ps1 -TargetDir $Target -Check
          if ($LASTEXITCODE -ne 0) { Write-Error "FRESH INSTALL NOT CURRENT: exit $LASTEXITCODE"; exit 1 }
          if ((Get-Tree $Target) -ne $Before) { Write-Error "CHECK CHANGED FILES"; exit 1 }

          $Claude = Join-Path $Target "CLAUDE.md"
          [IO.File]::WriteAllText($Claude, ([IO.File]::ReadAllText($Claude) -replace "(?m)^3\. .*$", "3. STALE RULE"))
          Add-Content -Path (Join-Path $Target ".agents\skills\token-efficient-work\SKILL.md") -Value "local edit"
          $Before = Get-Tree $Target
          $Out = (.\install-project.ps1 -TargetDir $Target -Check 6>&1 | ForEach-Object { "$_" }) -join "`n"
          if ($LASTEXITCODE -ne 1) { Write-Error "STALE PROJECT: exit $LASTEXITCODE, want 1"; exit 1 }
          if (-not $Out.Contains("outdated -> $Claude")) { Write-Error "STALE BLOCK NOT FLAGGED"; exit 1 }
          if (-not $Out.Contains("outdated -> $Target\.agents\skills\token-efficient-work\SKILL.md")) { Write-Error "CHANGED SKILL NOT FLAGGED"; exit 1 }
          if (-not $Out.Contains("current -> $Target\AGENTS.md")) { Write-Error "CURRENT FILE NOT REPORTED"; exit 1 }
          if ((Get-Tree $Target) -ne $Before) { Write-Error "CHECK CHANGED FILES"; exit 1 }

          $UserHome = Join-Path $env:RUNNER_TEMP "checkhome"
          New-Item -ItemType Directory -Force -Path $UserHome | Out-Null
          .\install.ps1 -UserHome $UserHome -Check
          if ($LASTEXITCODE -ne 1) { Write-Error "EMPTY HOME: exit $LASTEXITCODE, want 1"; exit 1 }
          if (Get-ChildItem -Force $UserHome) { Write-Error "CHECK WROTE TO AN EMPTY HOME"; exit 1 }
          .\install.ps1 -UserHome $UserHome
          .\install.ps1 -UserHome $UserHome -Check
          if ($LASTEXITCODE -ne 0) { Write-Error "FRESH USER INSTALL NOT CURRENT: exit $LASTEXITCODE"; exit 1 }
          $Gemini = Join-Path $UserHome ".gemini\GEMINI.md"
          [IO.File]::WriteAllText($Gemini, ([IO.File]::ReadAllText($Gemini) -replace "(?m)^3\. .*$", "3. STALE RULE"))
          $Out = (.\install.ps1 -UserHome $UserHome -Check 6>&1 | ForEach-Object { "$_" }) -join "`n"
          if ($LASTEXITCODE -ne 1) { Write-Error "STALE HOME: exit $LASTEXITCODE, want 1"; exit 1 }
          if (-not $Out.Contains("outdated -> $Gemini")) { Write-Error "STALE BLOCK NOT FLAGGED"; exit 1 }
          Write-Host "OK: powershell -Check test passed"
          exit 0
