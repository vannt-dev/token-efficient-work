# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: ci
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  commits:
    uses: vannt-dev/repokeeper/.github/workflows/commitlint.yml@v0
  script:
    uses: vannt-dev/repokeeper/.github/workflows/stack-script.yml@v0
    with:
      shell-scripts: "true"
      powershell-scripts: "true"
      test-command: ""
  result:
    name: CI result
    if: always()
    needs:
      - script
      - commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
